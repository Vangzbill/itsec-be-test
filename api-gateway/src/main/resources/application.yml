server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 100
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: auth-service
          uri: http://${AUTH_HOST:localhost}:8081
          predicates:
            - Path=/auth/**
        - id: article-service
          uri: http://${ARTICLE_HOST:localhost}:8082
          predicates:
            - Path=/articles/**
        - id: audit-service
          uri: http://${AUDIT_HOST:localhost}:8083
          predicates:
            - Path=/audit/**

management:
  endpoints:
    web:
      exposure:
        include: health
