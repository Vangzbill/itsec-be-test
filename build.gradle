plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.4' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
    group = 'asia.itsec'
    version = '1.0.0'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        // Actuator for /health endpoints
        implementation 'org.springframework.boot:spring-boot-starter-actuator'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    test {
        useJUnitPlatform()
        environment 'JWT_SECRET', 'test-only-secret-key-0123456789abcdef'
        finalizedBy jacocoTestReport
    }

    def coverageExcludes = [
        '**/*Application.class',
        '**/*Config.class',
        '**/*Configuration.class',
        '**/domain/*.class',
        '**/*Entity.class',
        '**/*Document.class',
        '**/*Request.class',
        '**/*Response.class',
        '**/*Command.class',
        '**/*Exception.class',
        '**/*ExceptionHandler.class',
        '**/*Builder.class',
        '**/Jpa*Repository.class',
        '**/Mongo*Repository.class',
        '**/HealthController.class',
        'asia/itsec/shared/payload/**',
        'asia/itsec/shared/event/**',
    ]

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
        classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coverageExcludes)
            })
        )
    }

    jacocoTestCoverageVerification {
        dependsOn test
        classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: coverageExcludes)
            })
        )
        violationRules {
            rule {
                limit {
                    minimum = 0.80
                }
            }
        }
    }

    if (project.name in ['auth-service', 'article-service', 'audit-service']) {
        check.dependsOn jacocoTestCoverageVerification
    }
}
